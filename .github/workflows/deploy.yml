
name: Deploy Vite React Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js and npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install Nginx if missing
      - name: Install Nginx
        run: |
          if ! command -v nginx >/dev/null 2>&1; then
            echo "Installing Nginx..."
            sudo apt-get update
            sudo apt-get install -y nginx
          else
            echo "Nginx is already installed"
          fi

      # 4. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 5. Build Vite React application
      - name: Build Application
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # 6. Create deployment directory
      - name: Clean Deployment Directory
        run: |
          sudo rm -rf /var/www/my-react-app
          sudo mkdir -p /var/www/my-react-app

      # 7. Deploy production build
      - name: Deploy Build
        run: |
          sudo cp -a dist/. /var/www/my-react-app/
          sudo chown -R www-data:www-data /var/www/my-react-app
          sudo chmod -R 755 /var/www/my-react-app

      # 8. Configure Nginx automatically
      - name: Configure Nginx
        run: |
          sudo tee /etc/nginx/sites-available/my-react-app > /dev/null <<'EOF'
          server {
              listen 80;
              listen [::]:80;

              server_name _;

              root /var/www/my-react-app;
              index index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
                  try_files $uri =404;
                  expires 30d;
                  add_header Cache-Control "public, immutable";
              }

              location ~ /\. {
                  deny all;
              }
          }
          EOF

          # Enable Nginx site
          sudo ln -sfn \
            /etc/nginx/sites-available/my-react-app \
            /etc/nginx/sites-enabled/my-react-app

          # Disable default Nginx site
          sudo rm -f /etc/nginx/sites-enabled/default

      # 9. Validate and reload Nginx
      - name: Restart Nginx
        run: |
          sudo nginx -t
          sudo systemctl enable nginx
          sudo systemctl restart nginx

      # 10. Deployment status
      - name: Deployment Complete
        run: |
          echo "Deployment successful!"
          echo "Application: /var/www/my-react-app"
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "Nginx: $(nginx -v 2>&1)"
